# =============================================================================
# Release — Build distribution ZIP and publish GitHub Release on tag push
# Trigger: git tag -a v1.7.0 -m "v1.7.0" && git push origin v1.7.0
# =============================================================================
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Lint (gate)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run format check and PSScriptAnalyzer
        shell: pwsh
        run: |
          ./scripts/Invoke-CodeQuality.ps1 -SkipTests

  # ---------------------------------------------------------------------------
  # Test (gate — matrix)
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Scope CurrentUser -Force

      - name: Run Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path          = './tests'
          $cfg.Run.PassThru      = $true
          $cfg.Output.Verbosity  = 'Detailed'
          $cfg.TestResult.Enabled      = $true
          $cfg.TestResult.OutputPath   = 'testResults.xml'
          $cfg.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) { exit 1 }

  # ---------------------------------------------------------------------------
  # Build ZIP + Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PS2EXE
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force

      - name: Build Windows EXE package
        id: build
        shell: pwsh
        run: |
          ./scripts/Build-WindowsReleasePackage.ps1 `
            -ProjectRoot "$PWD" `
            -OutputDirectory "$env:RUNNER_TEMP\release" `
            -GitHubOutputPath "$env:GITHUB_OUTPUT"

      - name: Validate ZIP content policy
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $exePath = '${{ steps.build.outputs.exe_path }}'
          $zipPath = '${{ steps.build.outputs.zip_path }}'

          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "EXE asset not found: $exePath"
          }

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "ZIP asset not found: $zipPath"
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $forbidden = @($archive.Entries | Where-Object {
              $_.FullName -match '\.(ps1|psm1|psd1)$'
            })

            if ($forbidden.Count -gt 0) {
              $list = @($forbidden | ForEach-Object { $_.FullName }) -join ', '
              throw "ZIP contains forbidden source files: $list"
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $title = 'dev-bootstrap ${{ steps.build.outputs.version }}'
          $exePath = '${{ steps.build.outputs.exe_path }}'
          $zipPath = '${{ steps.build.outputs.zip_path }}'
          $shaPath = '${{ steps.build.outputs.sha_path }}'

          foreach ($asset in @($exePath, $zipPath, $shaPath)) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Release asset not found: $asset"
            }
          }

          gh release view $tag | Out-Null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exePath $zipPath $shaPath --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to upload release assets for tag: $tag"
            }
          }
          else {
            gh release create $tag $exePath $zipPath $shaPath --title $title --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create GitHub release for tag: $tag"
            }
          }

      - name: Step Summary
        shell: pwsh
        run: |
          $md = [System.Text.StringBuilder]::new()
          [void]$md.AppendLine('## Release Summary')
          [void]$md.AppendLine()
          [void]$md.AppendLine('| Detail | Value |')
          [void]$md.AppendLine('|--------|-------|')
          [void]$md.AppendLine("| Tag | ``${{ github.ref_name }}`` |")
          [void]$md.AppendLine("| Version | ``${{ steps.build.outputs.version }}`` |")
          [void]$md.AppendLine("| Executable | ``${{ steps.build.outputs.exe_name }}`` |")
          [void]$md.AppendLine("| Asset | ``${{ steps.build.outputs.zip_name }}`` |")
          [void]$md.AppendLine("| SHA file | ``${{ steps.build.outputs.sha_name }}`` |")
          [void]$md.AppendLine("| SHA256 | ``${{ steps.build.outputs.sha256 }}`` |")
          [void]$md.AppendLine("| Release | ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }} |")
          $md.ToString() >> $env:GITHUB_STEP_SUMMARY
